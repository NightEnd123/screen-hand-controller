name: release

# Push a tag like v0.2.0 to build GestureControl-v0.2.0-windows.zip and publish it as a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up (venv, packages, hand model)
        shell: pwsh
        run: .\setup.ps1
      - name: Build
        shell: pwsh
        run: .\build.ps1 -Version ${{ github.ref_name }}
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist\GestureControl-${{ github.ref_name }}-windows.zip" --title "Gesture Control ${{ github.ref_name }}" --generate-notes
