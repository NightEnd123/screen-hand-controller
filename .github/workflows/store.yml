name: store package

# Builds the Microsoft Store package (.msix) and keeps it as a download on the workflow run
# (Actions tab > this run > Artifacts). Runs on version tags, or by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up (venv, packages, hand model)
        shell: pwsh
        run: .\setup.ps1
      - name: Build the app
        shell: pwsh
        run: .\build.ps1 -Version store
      - name: Build the Store package
        shell: pwsh
        run: |
          $v = (Select-String -Path gesture_control\__init__.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          .\packaging\msix\build_msix.ps1 -Version $v
      - uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: dist/*.msix
          if-no-files-found: error
